syntax = "proto3";

package whisperx;

service WhisperXService {
    rpc TranscribeAudio (TranscriptionRequest) returns (TranscriptionResponse);
}

message TranscriptionRequest {
    string audio_path = 1;
    string model_choice = 2;
    string device = 3;
    int32 batch_size = 4;
    string compute_type = 5;
}

message TranscriptionResponse {
    string transcript = 1;
    string error = 2;
}